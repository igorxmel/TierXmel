<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Личные оценки игр: тирлист, разбор по критериям и награды.">
  <title>Тирлист игр</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%230c0b0a%27/%3E%3Crect x=%277%27 y=%278%27 width=%2718%27 height=%274%27 rx=%272%27 fill=%27%23fcead0%27/%3E%3Crect x=%277%27 y=%2714%27 width=%2713%27 height=%274%27 rx=%272%27 fill=%27%23d3a354%27/%3E%3Crect x=%277%27 y=%2720%27 width=%278%27 height=%274%27 rx=%272%27 fill=%27%238b6930%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@300;600;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">Тирлист<small>личные оценки игр</small></a>
    <nav class="nav">
      <a class="nav__link nav__link--on" href="index.html">Тирлист</a>
      <a class="nav__link" href="stats.html">Статистика</a>
      <a class="nav__link" href="awards.html">Награды</a>
    </nav>
    <div class="axis" id="axis"></div>
  </header>

  <main class="page">
    <div class="page-head">
      <h1 class="page-title" id="title">Тирлист</h1>
      <p class="page-sub" id="intro"></p>
    </div>

    <div class="toolbar" id="toolbar"></div>
    <div class="active" id="active"></div>

    <div class="grid" id="grid"></div>
  </main>

  <footer class="footer">
    <span>Личные оценки, не претендующие на объективность.</span>
    <span>Данные об играх: <a href="https://rawg.io/" target="_blank" rel="noopener">RAWG</a>.</span>
  </footer>

  <script type="module">
    import { loadData, tierlistGames, awaitingReview, unrated } from './js/data.js';
    import { AXES, readState, writeState, applyFilters, renderToolbar, bindDismiss, plural } from './js/filters.js';
    import { renderTierGrid } from './js/render-tier.js';

    const nodes = {
      axis: document.getElementById('axis'),
      toolbar: document.getElementById('toolbar'),
      active: document.getElementById('active'),
      grid: document.getElementById('grid'),
      intro: document.getElementById('intro'),
      title: document.getElementById('title'),
    };

    const { index, games } = await loadData();
    const state = readState();
    bindDismiss(nodes.toolbar);

    function renderAxisSwitch() {
      nodes.axis.innerHTML = '';
      for (const axis of AXES) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'axis__btn' + (state.axis === axis.id ? ' axis__btn--on' : '');
        button.innerHTML = `${axis.label}<small>${axis.hint}</small>`;
        button.addEventListener('click', () => { state.axis = axis.id; render(); });
        nodes.axis.append(button);
      }
    }

    function render() {
      writeState(state);
      renderAxisSwitch();

      const visible = applyFilters(games, state);
      const ranked = tierlistGames(visible, state.axis);

      renderToolbar(nodes.toolbar, nodes.active, games, state, index, render);
      renderTierGrid(nodes.grid, ranked, state.axis, index, {
        awaiting: state.axis === 'quality' ? awaitingReview(visible) : [],
        unrated: unrated(visible),
      });

      nodes.title.textContent = state.axis === 'quality' ? 'По качеству' : 'По кайфу';
      nodes.intro.textContent = state.axis === 'quality'
        ? `Разбор по критериям, 0–900: насколько хорошо игра делает то, чем является. В рядах ${ranked.length} из ${games.length}.`
        : `Чистая субъективка, 0–100: насколько зашло мне. В рядах ${ranked.length} из ${games.length}.`;
    }

    render();
  </script>
</body>
</html>
